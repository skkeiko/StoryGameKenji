<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Overview</title>
</head>
<body>
        <h1>Home Page</h1>
    <p>This game is a <i><strong>text-based adventure game</strong></i> that I created as a project for my capstone class. This game allows players to make choices that affect the outcome of the story, providing an interactive experience.</p>
    <img src="https://www.bing.com/th/id/OIP.nvcaacyomM4Sqm7uelLgDQHaEJ?w=193&h=135&c=8&rs=1&qlt=90&o=6&dpr=1.5&pid=ImgAns&rm=2">

    <form action="game.html" method="get">
        <label for="player-name">Enter your username:</label>
        <input type="text" id="player-name" name="player-name" required>
        <br><br>
        <label for="year-born">Enter your year of birth:</label>
        <input type="number" id="year-born" name="year-born" min="1900" max="2023" required>
        <br>
        <br>
        <label for="gender">Select your gender:</label>
        <select id="gender" name="gender" required>
            <option value="">--Please choose an option--</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        <br><br>
        <button type="submit">Start Game</button>
    </form>
    
    <nav>
            <ul> 
                <li><a href="about.html">About the creator</a></li>
            </ul>
        </nav>
</body>
</html>
